name: CI

# `push` is restricted to `main` deliberately. With a bare `on: [push,
# pull_request]` every PR branch ran the whole matrix twice — once for the
# push, once for the PR — which is why PR #1 showed eight checks for four
# jobs. Branch pushes are now covered by the PR that contains them, and `main`
# is still covered directly for the goldens.
on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are cancelled; `main` runs are never cancelled, because a
# `main` run is what emits the golden artifacts the determinism matrix compares.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# See the note on the cache step. `Swatinem/rust-cache` sets this itself; it is
# stated here so it survives a job that does not use the cache, and so the value
# is where a reader looks for it.
env:
  CARGO_INCREMENTAL: 0

jobs:
  # Platform-independent checks, on one runner, as their own status check.
  #
  # Split out of `test` for two reasons. They are genuinely
  # platform-independent — `rustfmt` pins `newline_style = "Unix"` and rustdoc
  # resolves the same links everywhere — so running them three times bought
  # nothing. And as steps inside a matrix job they were invisible: the PR check
  # list showed `test (ubuntu-latest)` and gave no sign that formatting and
  # documentation had been verified at all.
  quality:
    name: quality (fmt, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # **Bevy's Linux build needs system headers this runner does not ship**,
      # and nothing local can see it: the viewer builds fine on macOS, where
      # these are part of the platform. The first push of the Bevy branch failed
      # here with `alsa-sys` panicking in its build script — "Package 'alsa' was
      # not found in the pkg-config search path" — before a single test ran.
      #
      # `libasound2-dev` is ALSA, pulled by Bevy's audio; `libudev-dev` is what
      # `winit` uses to enumerate input devices. **The viewer plays no sound**,
      # so the better fix is to stop pulling `bevy_audio` at all — that means
      # `default-features = false` plus an explicit feature list, which is real
      # work with its own review surface rather than a line in a workflow. This
      # unblocks CI; the trim is filed as its own task.
      #
      # Skipped on macOS and Windows, where the equivalents are part of the SDK.
      - name: Linux system libraries for the engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      - name: Show toolchain
        run: rustup show active-toolchain

      # Third-party build artefacts only. **The workspace's own crates are
      # never restored from cache**, which is what makes this safe under §13.4
      # rather than merely convenient — verified against the action's own
      # documentation, not assumed: "the workspace crates themselves are not
      # cached". Every line of result-affecting code is compiled from source on
      # every run, so a cache hit cannot put a stale `borbax-*` artefact into
      # the profile that mints goldens.
      #
      # What the key covers, and why each part matters here:
      #
      # - **the rustc release / host / hash**, plus a hash of
      #   `rust-toolchain.toml`. The host triple is what keeps the three matrix
      #   legs apart (`aarch64-apple-darwin` / `x86_64-unknown-linux-gnu` /
      #   `x86_64-pc-windows-msvc`), so macOS cannot restore Linux artefacts.
      #   **A change to the selected `rustc` identity invalidates the cache**,
      #   which is what §18.1 wants, since it treats a compiler bump as a
      #   physics change.
      #
      #   An earlier version of this comment said "bumping `.prototools`
      #   invalidates the cache". That names the wrong file: `.prototools` is
      #   the *installer* and CI does not run proto at all — `rust-toolchain.toml`
      #   is the selection mechanism, as the note on the toolchain step above
      #   says at length. The two cannot drift, because `xtask`'s
      #   `check_toolchain_pins_agree` fails the build when they do, so the
      #   practical effect is the same; the stated mechanism was not.
      # - **a hash of every `Cargo.lock` / `Cargo.toml`.** `--locked` already
      #   pins the graph; this stops a lockfile change silently reusing a
      #   `libm` compiled from a different version, which is the one diagnosis
      #   the golden matrix must never give wrongly.
      # - **`CARGO_*` / `RUST*` environment variables**, so a `RUSTFLAGS`
      #   change does not reuse artefacts built under the old flags.
      #
      # `CARGO_INCREMENTAL=0` is set by the action itself. It is repeated at
      # workflow level below so the value is visible where someone looks for
      # it, and so it holds on any future job that does not use the cache:
      # incremental artefacts are keyed to absolute paths and a stale
      # `incremental/` directory is exactly the sort of thing that makes one
      # leg of a determinism matrix differ for a non-physics reason.
      #
      # **What this is worth, measured over six runs.** Cache-hit against
      # uncached, per job: `quality` 34s -> 23s, macOS 151s -> 78s, ubuntu
      # 191s -> 134s, **Windows 350s -> 277s (21%)**.
      #
      # The Windows number is stated as a working estimate rather than a
      # constant, and an earlier version of this comment got it wrong in the
      # other direction — it said "Windows is unchanged", on the strength of one
      # run whose cache had **missed entirely** (376s) and one hit at 310s. With
      # three hits (310 / 263 / 258) against three uncached (407 / 363 / 281),
      # two of the three cached runs fall below *every* uncached run, but the
      # ranges still overlap and an exact permutation test gives p = 0.10, which
      # is the floor for n = 3 against n = 3. Real, not yet significant.
      #
      # **The paragraph that used to sit here is void, and the reason is worth
      # more than the number it quoted.** It read: "the workspace has **seven**
      # third-party packages (`libm`, `thiserror`, `thiserror-impl`, `syn`,
      # `proc-macro2`, `quote`, `unicode-ident`), so the Windows archive is
      # 30 MB and restores in 5s" — and concluded from that smallness that the
      # cache had little upside to offer. Viewer Step 1 added `eframe`, which
      # took the lockfile from **13 entries to 366** — 7 workspace members and
      # **359 external packages**, against 6 external before. ("~353 third-party"
      # in the first version of this line was the *delta* quoted as a count.)
      # The archive is expected to grow by more than an order of magnitude, and
      # the timings above (`quality` 23/34s, macOS 78/151s, ubuntu 134/191s,
      # Windows 277/350s) were ALL measured before it.
      #
      # So: every cache figure in this file is now a pre-`eframe` measurement,
      # and the conclusion drawn from them inverts — with a large dependency
      # tree the cache matters far more, not less, and a cache miss costs
      # minutes rather than seconds. Re-measure before reasoning from any of
      # them. They are left in place rather than deleted because a stale number
      # labelled stale is evidence about the past; a deleted one is nothing.
      #
      # The `borbax-*` crates that dominate the build are still the ones this
      # deliberately never caches, and there are now six of them, not five.
      # Anyone wanting a larger cut should look at the test suite: it is
      # `embed`-bound, and `layout.rs` records a measured, bit-identical
      # **2.08x on `embed`** currently declined for want of a consumer.
      #
      # The Windows key also moved once in six runs, logging `No cache found`
      # under an environment-hash component that changed while macOS and Linux
      # held. Recorded rather than averaged away: an occasional cold Windows leg
      # is expected.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      # `[workspace.lints.rustdoc] broken_intra_doc_links = "deny"` was
      # enforcing nothing before this step existed. Verified rather than
      # assumed: a planted `[`NoSuchItem`]` link passes
      # `cargo clippy --all-targets -- -D warnings` cleanly, because clippy
      # does not run rustdoc lints — only `cargo doc` does. Same shape as the
      # `[lints] workspace = true` trap this repo has already hit twice: the
      # configuration is present, believed, and inert.
      #
      # It matters here more than in most codebases. Nearly every type in
      # `borbax-units` documents its contract with intra-doc links to its
      # siblings, and a rename silently rots every one of them.
      #
      # `--document-private-items` so the private helpers that carry the
      # load-bearing comments are checked too, and `RUSTDOCFLAGS` rather than
      # `--` because rustdoc lint levels are not `cargo doc` arguments.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items

  # The matrix is not for coverage — it is the enforcement mechanism for the
  # cross-platform determinism promise in spec §13.4. Every portability
  # hazard listed there is invisible on a single machine: the code runs, the
  # tests pass, the numbers look fine, and the failure only appears when
  # someone opens a shared seed on different hardware. Running goldens on
  # one platform would pass happily while the promise quietly rotted.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # `needs: quality` is the enforcement, not a sequencing preference.
    #
    # Splitting `fmt` out of this job made it *advisory*: branch protection
    # requires `test (…)` and `goldens …` by name, and a newly-created
    # `quality` job is in neither list — so for one commit, a PR with red
    # formatting or a broken intra-doc link was mergeable. The commit that
    # added `cargo doc` *because* a configured-but-inert check is this repo's
    # recorded failure mode had made the check configured-but-inert one level
    # up. A reviewer caught it by querying the protection API.
    #
    # This makes the gate transitive: `quality` fails, the matrix never runs,
    # and the required checks cannot go green. It holds without anyone
    # remembering a `gh api` call, and it holds for PRs opened before
    # `quality` is added to the required list. Adding it there too is still
    # worth doing — belt and braces — but is no longer load-bearing.
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # No proto here, deliberately. rust-toolchain.toml is the selection
      # mechanism everywhere (see that file), and the runners all ship rustup,
      # which reads it and installs the pinned toolchain with the components it
      # names. Running proto as well made two installers fight over the same
      # rustup toolchain: proto's rust plugin laid one down that rustup did not
      # consider to have `cargo`, and every leg failed with "'cargo' is not
      # installed for the toolchain '1.97.1-...'".
      #
      # .prototools remains the local-dev installer and xtask fails if the two
      # pins drift. If a non-Rust tool is ever added to .prototools, CI needs a
      # proto setup step back — nothing here would notice on its own, because
      # this project is Rust-only by construction (spec §14.0).
      #
      # **Bevy's Linux build needs system headers this runner does not ship**,
      # and nothing local can see it: the viewer builds fine on macOS, where
      # these are part of the platform. The first push of the Bevy branch failed
      # here with `alsa-sys` panicking in its build script — "Package 'alsa' was
      # not found in the pkg-config search path" — before a single test ran.
      #
      # `libasound2-dev` is ALSA, pulled by Bevy's audio; `libudev-dev` is what
      # `winit` uses to enumerate input devices. **The viewer plays no sound**,
      # so the better fix is to stop pulling `bevy_audio` at all — that means
      # `default-features = false` plus an explicit feature list, which is real
      # work with its own review surface rather than a line in a workflow. This
      # unblocks CI; the trim is filed as its own task.
      #
      # Skipped on macOS and Windows, where the equivalents are part of the SDK.
      - name: Linux system libraries for the engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      # **This job builds the whole dependency graph twice and the Linux runner
      # does not have the disk for it.** Measured, not guessed: run 30933427373
      # logged `Free space left: 0 MB` and then `rust-lld` died linking
      # `borbax-ui` with `ld terminated with signal 7 [Bus error], core dumped`
      # — SIGBUS, which is what a linker writing through a full-disk mmap gets
      # instead of a clean ENOSPC. The macOS leg of the same run passed, so
      # nothing about the code is at fault and no local gate can see this.
      #
      # The cost is structural rather than incidental, which is why this is a
      # step and not a retry. `xtask`, `clippy --all-targets` and `test` all
      # populate `target/debug`, against a tree Bevy took from 13 `Cargo.lock`
      # entries to 366.
      #
      # **Which build died matters, because it rules out the obvious fix.**
      # Step 8 (`Test`, debug) failed and step 9 (`Test --release`) was
      # *skipped* — the release leg never started. So freeing the debug tree
      # before the release leg, which is the first thing anyone reaches for,
      # fires at a point this job never reaches.
      #
      # That lever was first rejected here for a reason that is simply wrong,
      # and the correction is kept because the wrong version would be reused.
      # It said cleaning between the legs "trades disk for a full rebuild". It
      # does not: `target/debug` and `target/release` are disjoint artifact
      # trees, so deleting the first costs the second nothing — the release leg
      # compiles from scratch either way. That claim is true of the
      # *clippy -> test* boundary, which does share artifacts, and it had been
      # applied to the wrong boundary.
      #
      # Its real cost is the **cache**: `Swatinem/rust-cache` saves `target/`
      # in post-job, so deleting `target/debug` first means debug dependencies
      # are never cached and every later run rebuilds them — ~50 minutes here,
      # uncached. It stays available as the next lever if headroom is still
      # tight, with that cost understood.
      #
      # Deleting preinstalled toolchains this workspace cannot use is therefore
      # the cheapest fix: it changes nothing about the build — no profile
      # change, no feature change, no effect on codegen, so goldens are
      # untouched — and it keeps both caches. Trimming Bevy's default features
      # cuts the tree further and is filed as issue #28.
      #
      # Only named subdirectories are removed, never `/opt/hostedtoolcache`
      # wholesale as the usual recipe does; on some runner images that is where
      # the toolchain lives.
      #
      # `df -h /` brackets the deletion deliberately. When this fails again the
      # log should say how much headroom there was, not merely that there was
      # none — this failure had to be diagnosed from a linker stack dump.
      # `|| true` because the runner image's contents are not a contract, and a
      # path disappearing upstream must not turn into a red build.
      #
      # Linux only: macOS passed this run, and the Windows image does not carry
      # these directories.
      - name: Free disk space for the two-profile build
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost || true
          df -h /
          # **A named failure at second 12 instead of a linker SIGBUS forty
          # minutes later.** Printing `df` fixed the diagnosis problem; it does
          # not fix the *reporting* problem, because a run that reclaims too
          # little still fails as `rust-lld` dying with a signal and an LLVM
          # stack dump.
          #
          # The floor is a reported number rather than a tuned one. Run
          # 30933427373 died at 0 MB having started with 15 GB; run 30943848944
          # passed with 36 GB. 20 GB therefore sits above the size known to be
          # insufficient and below the size known to be sufficient — it is not a
          # claim about what the build needs, which nothing here has measured.
          free_mb=$(df --output=avail -m / | tail -1 | tr -d ' ')
          echo "free after cleanup: ${free_mb} MB"
          if [ "$free_mb" -lt 20000 ]; then
            echo "::error::only ${free_mb} MB free after cleanup; the two-profile \
          build needs more, and without this it would fail as a linker crash"
            exit 1
          fi

      - name: Show toolchain
        run: rustup show active-toolchain

      # Third-party build artefacts only. **The workspace's own crates are
      # never restored from cache**, which is what makes this safe under §13.4
      # rather than merely convenient — verified against the action's own
      # documentation, not assumed: "the workspace crates themselves are not
      # cached". Every line of result-affecting code is compiled from source on
      # every run, so a cache hit cannot put a stale `borbax-*` artefact into
      # the profile that mints goldens.
      #
      # What the key covers, and why each part matters here:
      #
      # - **the rustc release / host / hash**, plus a hash of
      #   `rust-toolchain.toml`. The host triple is what keeps the three matrix
      #   legs apart (`aarch64-apple-darwin` / `x86_64-unknown-linux-gnu` /
      #   `x86_64-pc-windows-msvc`), so macOS cannot restore Linux artefacts.
      #   **A change to the selected `rustc` identity invalidates the cache**,
      #   which is what §18.1 wants, since it treats a compiler bump as a
      #   physics change.
      #
      #   An earlier version of this comment said "bumping `.prototools`
      #   invalidates the cache". That names the wrong file: `.prototools` is
      #   the *installer* and CI does not run proto at all — `rust-toolchain.toml`
      #   is the selection mechanism, as the note on the toolchain step above
      #   says at length. The two cannot drift, because `xtask`'s
      #   `check_toolchain_pins_agree` fails the build when they do, so the
      #   practical effect is the same; the stated mechanism was not.
      # - **a hash of every `Cargo.lock` / `Cargo.toml`.** `--locked` already
      #   pins the graph; this stops a lockfile change silently reusing a
      #   `libm` compiled from a different version, which is the one diagnosis
      #   the golden matrix must never give wrongly.
      # - **`CARGO_*` / `RUST*` environment variables**, so a `RUSTFLAGS`
      #   change does not reuse artefacts built under the old flags.
      #
      # `CARGO_INCREMENTAL=0` is set by the action itself. It is repeated at
      # workflow level below so the value is visible where someone looks for
      # it, and so it holds on any future job that does not use the cache:
      # incremental artefacts are keyed to absolute paths and a stale
      # `incremental/` directory is exactly the sort of thing that makes one
      # leg of a determinism matrix differ for a non-physics reason.
      #
      # **What this is worth, measured over six runs.** Cache-hit against
      # uncached, per job: `quality` 34s -> 23s, macOS 151s -> 78s, ubuntu
      # 191s -> 134s, **Windows 350s -> 277s (21%)**.
      #
      # The Windows number is stated as a working estimate rather than a
      # constant, and an earlier version of this comment got it wrong in the
      # other direction — it said "Windows is unchanged", on the strength of one
      # run whose cache had **missed entirely** (376s) and one hit at 310s. With
      # three hits (310 / 263 / 258) against three uncached (407 / 363 / 281),
      # two of the three cached runs fall below *every* uncached run, but the
      # ranges still overlap and an exact permutation test gives p = 0.10, which
      # is the floor for n = 3 against n = 3. Real, not yet significant.
      #
      # **The paragraph that used to sit here is void, and the reason is worth
      # more than the number it quoted.** It read: "the workspace has **seven**
      # third-party packages (`libm`, `thiserror`, `thiserror-impl`, `syn`,
      # `proc-macro2`, `quote`, `unicode-ident`), so the Windows archive is
      # 30 MB and restores in 5s" — and concluded from that smallness that the
      # cache had little upside to offer. Viewer Step 1 added `eframe`, which
      # took the lockfile from **13 entries to 366** — 7 workspace members and
      # **359 external packages**, against 6 external before. ("~353 third-party"
      # in the first version of this line was the *delta* quoted as a count.)
      # The archive is expected to grow by more than an order of magnitude, and
      # the timings above (`quality` 23/34s, macOS 78/151s, ubuntu 134/191s,
      # Windows 277/350s) were ALL measured before it.
      #
      # So: every cache figure in this file is now a pre-`eframe` measurement,
      # and the conclusion drawn from them inverts — with a large dependency
      # tree the cache matters far more, not less, and a cache miss costs
      # minutes rather than seconds. Re-measure before reasoning from any of
      # them. They are left in place rather than deleted because a stale number
      # labelled stale is evidence about the past; a deleted one is nothing.
      #
      # The `borbax-*` crates that dominate the build are still the ones this
      # deliberately never caches, and there are now six of them, not five.
      # Anyone wanting a larger cut should look at the test suite: it is
      # `embed`-bound, and `layout.rs` records a measured, bit-identical
      # **2.08x on `embed`** currently declined for want of a consumer.
      #
      # The Windows key also moved once in six runs, logging `No cache found`
      # under an environment-hash component that changed while macOS and Linux
      # held. Recorded rather than averaged away: an occasional cold Windows leg
      # is expected.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `--locked` on every invocation, from the commit that added the first
      # runtime dependency. Without it a stale Cargo.lock lets each of the
      # three legs independently re-resolve the graph, so the platforms could
      # build against different versions of `libm` — and the golden matrix
      # would report that as a portability failure in the simulation, which is
      # the one diagnosis it must never give wrongly. With it, a stale lock
      # fails loudly on all three legs with "the lock file needs to be
      # updated", which is a five-second fix instead of a day.
      # Stays on the matrix rather than moving to `quality`. It walks the
      # filesystem and compares paths component-wise, and its own doc comments
      # say the Windows behaviour is the reason that code is written the way it
      # is — so it is one of the few checks where running it three times is the
      # point.
      - name: Fiction guarantees (spec §5)
        run: cargo run --locked -p xtask
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # The release leg is not redundant. `debug_assert!` and `overflow-checks`
      # both key off `debug_assertions`, so a guard can be present in the suite
      # above and absent from the profile that mints the goldens — which is
      # exactly the defect the Task 2 review found in `Mass::from_f64_quantised`
      # and then found again, one operator away, in `impl Add for Mass`.
      # `values_off_the_grid_are_refused_in_every_profile` is named for a
      # promise nothing was keeping until this step existed. ~5s warm.
      - name: Test (release — the profile that mints goldens)
        run: cargo test --locked --workspace --release
      # borbax-cli does not exist until Task 21. Without this guard the whole
      # `test` job fails on all three platforms for twenty tasks — and because
      # `determinism-matrix` is gated on `needs: test`, it would never run at
      # all. Its inertness would be accidental rather than designed, which is
      # the opposite of what §13.6 needs.
      #
      # `shell: bash` is load-bearing, not tidiness. The Windows leg would
      # otherwise run under pwsh, whose redirection operator rewrites the
      # stream with native CRLF line endings — so `diff -u` in
      # `determinism-matrix` would report a divergence on the very first
      # golden run, for a reason that has nothing to do with the simulation.
      # A determinism gate that cries wolf once gets muted forever.
      - name: Emit golden hashes
        if: hashFiles('crates/borbax-cli/Cargo.toml') != ''
        shell: bash
        run: cargo run --locked -p borbax-cli --release -- goldens --emit > goldens-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('crates/borbax-cli/Cargo.toml') != ''
        with:
          name: goldens-${{ matrix.os }}
          path: goldens-${{ matrix.os }}.txt

  # The actual cross-platform assertion. Task 1 creates the job with a
  # placeholder step; it becomes real once borbax-cli exists (Task 20).
  determinism-matrix:
    name: goldens identical across platforms
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Compare golden hashes across platforms
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(goldens-*/goldens-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No golden artifacts yet (expected before Task 20)."
            exit 0
          fi
          ref="${files[0]}"
          fail=0
          for f in "${files[@]:1}"; do
            if ! diff -u "$ref" "$f"; then
              echo "DETERMINISM FAILURE: $f differs from $ref"
              fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "goldens identical across ${#files[@]} platforms"
          exit $fail
