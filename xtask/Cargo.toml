[package]
name = "xtask"
edition.workspace = true
# Inherited explicitly. `[workspace.package] rust-version` is not applied to a
# member unless the member asks for it, so omitting this line does not fall
# back to the workspace value — it means the crate has no MSRV at all, and
# cargo will build it with any toolchain. In a repo where the pin is part of
# the determinism contract (spec §18.1), that is the difference between a
# stale toolchain failing loudly and silently producing different floats.
# Every crate added from Task 2 onward needs this line.
rust-version.workspace = true
license.workspace = true
version = "0.1.0"
publish = false

# Same trap as `rust-version` above, one line further down. `[workspace.lints]`
# is not applied to a member that omits this — the crate simply has no lints,
# so `unsafe_code = "forbid"` forbids nothing and `unwrap_used = "deny"` denies
# nothing. Verified by planting an `.unwrap()` here: before this line it drew a
# plain warning from a different lint entirely; `clippy::unwrap_used` never
# fired at all. Every crate added from Task 2 onward needs this line too.
[lints]
workspace = true

[dependencies]
# Parsing Rust to enforce §13.1's no-derived-stream rule. Build tooling only —
# `xtask` cannot affect simulation output, so this is the cheap side of the
# dependency asymmetry CLAUDE.md draws, the same tier as `insta` or `criterion`.
# It needs no pin beyond the lockfile and no determinism review.
#
# It is also free: `syn` is already in `Cargo.lock` via `thiserror-impl`, so
# this adds zero crates to the tree.
#
# Hand-rolling was tried twice and failed twice — the first version caught one
# signature shape of six, the second six of fifteen, and it false-positived on
# a block comment that merely *described* the forbidden method. Both failures
# were the same kind: a textual matcher covers the shapes someone thought to
# probe. An AST makes the receiver, the return type and the enclosing `impl`
# structural facts rather than substrings.
syn = { version = "3", features = ["full", "parsing", "printing"] }
quote = "1"
# `span-locations` so a failure names a line an editor can open.
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
# Reading `clippy.toml` in the cross-check tests that hold the two §13.1 ban
# lists in step. A **dev**-dependency of a build tool: two tiers below anything
# that could reach a simulation result.
#
# Free, on the same argument this manifest already makes for `syn`: `toml` is
# already in `Cargo.lock` via `egui_kittest`, so this adds zero crates.
#
# Hand-rolled first, and it failed the way this manifest already records
# hand-rolled matchers failing. The line-based version read a **commented-out**
# entry as an active one — so someone disabling a hasher ban to unblock a build
# would leave the cross-check green while clippy, the half the test calls "the
# authority", enforced nothing. It also lost section tracking on a single-line
# array and matched `disallowed-types-extra` by prefix. Each is fixable; the
# class is not, which is precisely the argument made for `syn` above.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
