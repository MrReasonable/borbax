[workspace]
resolver = "3"
# `crates/*` joined this list in Task 2, with the first crate. Cargo falls back
# to treating a glob that matches nothing as a literal path, so listing
# `crates/*` before `crates/` has a package in it fails the workspace outright —
# which is why Task 1 shipped without it.
members = ["crates/*", "experiments", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
borbax-units = { path = "crates/borbax-units" }
borbax-rng = { path = "crates/borbax-rng" }
borbax-universe = { path = "crates/borbax-universe" }
borbax-molecule = { path = "crates/borbax-molecule" }
borbax-reaction = { path = "crates/borbax-reaction" }
borbax-beaker = { path = "crates/borbax-beaker" }
borbax-render = { path = "crates/borbax-render" }
borbax-geometry = { path = "crates/borbax-geometry" }

[workspace.dependencies.thiserror]
version = "2"
[workspace.dependencies.libm]
version = "0.2"

[workspace.lints.rust]
# No unsafe anywhere. If a benchmark ever justifies it, lift this on the one
# crate that needs it rather than the workspace — the exception should be
# visible in a diff.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Groups at priority -1 so the specific lints below can override them.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Denied because in this codebase they are correctness, not style. A panic in
# a library is a simulation that dies eight hours into an overnight run.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# The §13.1 transcendental ban. The list of paths lives in `clippy.toml`
# because that is the only place clippy will read it from; this line is what
# makes the list load-bearing rather than advisory. It matches resolved paths,
# so `x.exp()`, `f64::exp(x)`, `<f64>::sin(x)` and the point-free
# `.map(f64::exp)` are all one rule — which a text scanner cannot manage, as
# the Task 2 review demonstrated by walking through the gap in ours.
disallowed_methods = "deny"

# `a[i]` is an unwrap wearing a hat. Warn rather than deny because the
# geometry code indexes fixed-size arrays with proven bounds constantly —
# those take an #[allow] with a one-line reason, and a bare #[allow] is a
# review finding.
indexing_slicing = "warn"

# Silent truncation is the gotcha most likely to produce a wrong number that
# looks plausible. Prefer TryFrom.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# Rewrites `a * b + c` into `a.mul_add(b, c)`, and it is a determinism trap
# in this repository specifically. Measured on the pinned toolchain rather
# than assumed:
#
#   x86-64 baseline   jmpq *fma@GOTPCREL(%rip)   <- the platform's libm
#   x86-64 +fma       vfmadd213sd
#   aarch64           fmadd
#
# The Linux and Windows CI legs compile for the baseline, so taking this
# lint's advice would put a dynamic call into three different libm
# implementations on the critical path — the same hazard as `exp` and `cos`
# in §13.4, which is why `f64::mul_add` lives in `std` and not `core`. It
# also changes the answer even where it is a single instruction: one rounding
# instead of two. The suggestion arrives in a diff looking like a free
# accuracy win, which is exactly what makes it worth denying by policy rather
# than catching in review.
#
# If a hot loop ever genuinely wants FMA, that is a deliberate per-site
# `#[allow]` accompanied by golden regeneration, not a global default.
suboptimal_flops = "allow"

# Wants `description`, `keywords`, `categories`, `readme` and `repository` on
# every package. Every member here sets `publish = false` — there is no
# registry listing for that metadata to appear in.
cargo_common_metadata = "allow"

# Allowed, with reasons — a bare allow is not acceptable anywhere else.
# `borbax_molecule::MoleculeGraph` reads better than the alternative.
module_name_repetitions = "allow"
# r/a and x/y/z are this domain's actual vocabulary, not lazy naming.
similar_names = "allow"
# #[must_use] is applied deliberately where dropping the result is a bug,
# not exhaustively on every getter.
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The beaker harness's whole value is that a chemistry-tuning iteration takes
# seconds, and at opt-level 0 it does not.
#
# What this does NOT do, measured rather than assumed: it does not make the
# unit newtypes scalarise. They are non-generic, so cross-crate they inline
# only under LTO or `#[inline]`, and the dev profile has no LTO — opt-level 1,
# 2 and 3 all left `a + b * s` as two calls with register spills until
# `#[inline]` was added to every operator in `borbax-units`. The earlier
# version of this comment claimed opt-level 1 bought the scalarisation, which
# was wrong; the attribute buys it, and this buys everything else.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
