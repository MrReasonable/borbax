[package]
name = "borbax-units"
edition.workspace = true
# `[workspace.package] rust-version` is not applied to a member unless the
# member asks for it. Omitting this line does not fall back to the workspace
# value — it means the crate has no MSRV at all, and cargo will build it with
# any toolchain. In a repo where the pin is part of the determinism contract
# (spec §18.1), that is the difference between a stale toolchain failing loudly
# and silently producing different floats.
rust-version.workspace = true
license.workspace = true
version = "0.1.0"
publish = false

# Same trap as `rust-version` above, one line further down. `[workspace.lints]`
# is not applied to a member that omits this — the crate simply has no lints,
# so `unsafe_code = "forbid"` forbids nothing and `unwrap_used = "deny"` denies
# nothing.
[lints]
workspace = true

[dependencies]
libm = { workspace = true }
thiserror = { workspace = true }
