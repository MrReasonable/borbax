[package]
name = "borbax-ui"
edition.workspace = true
# `[workspace.package] rust-version` is not applied to a member unless the
# member asks for it. Omitting this line means the crate has no MSRV at all,
# not that it inherits one — and the pin is part of the determinism contract
# (spec §18.1).
rust-version.workspace = true
license.workspace = true
version = "0.1.0"
publish = false

# The binary is `borbax`, not `borbax-ui`. Cargo defaults the binary name to
# the package name, and the double-clickable artefact is the one a child finds
# in a folder — `borbax-ui` names the crate's role in the workspace, which is a
# fact about the repository rather than about the program.
[[bin]]
name = "borbax"
path = "src/main.rs"

# Same trap, one line down: `[workspace.lints]` is inert for a member that
# omits this, so `unsafe_code = "forbid"` forbids nothing and
# `unwrap_used = "deny"` denies nothing. `check_every_member_inherits_the_lints`
# in xtask exists because this file is the first place anyone would be tempted
# to drop the line — this is the crate that will want `f32` trigonometry at
# Step 3 of the viewer plan.
[lints]
workspace = true

[dependencies]
# The §13.1 chokepoint, for the camera's trigonometry. **Adds zero packages** —
# `borbax-universe` already pulls it in, so this line names a dependency the
# tree resolves either way and makes it callable here.
#
# The viewer produces no simulation results, and that is deliberately not why
# this is here: §13.1 admits no exception, and the camera maths is scheduled to
# move into `borbax-geometry`, whose bytes are compared across the §13.4 matrix.
# See the Step 3 design memo, R15.
borbax-units = { workspace = true }
borbax-universe = { workspace = true }
# The shapes. `canonicalise` and `embed` are what turn a molecule into
# coordinates and radii the scene can stand spheres at — both per-species work
# under §8.6, both called exactly once, which `cargo xtask` checks rather than
# this comment asserting it.
borbax-molecule = { workspace = true }
# For the "surprise me" button, and for nothing else. The Global Constraint is
# that all randomness comes from `borbax_rng::Stream` — never `rand::random`,
# never `RandomState` — and it is honoured here even though a seed the user is
# shown and can retype is an *input* rather than a result. `next_range` is also
# modulo-bias-free, which `clock % 1_000_000` is not.
borbax-rng = { workspace = true }
# For `SeedError`'s `Display`. Already in the tree via `borbax-units`, so this
# adds zero crates and zero build time.
thiserror = { workspace = true }

# **The engine, and it displays only.** Ian's ruling, 2026-08-03: Bevy is for
# showing and interacting; the physics, the chemistry and the generation are
# ours. `check_the_engine_stays_in_the_viewer` enforces that this manifest is
# the *only* one under `crates/` allowed to name it — the rule is not a
# convention, because Bevy's ECS schedules in parallel and its query iteration
# order is not insertion order (measured), so a result path reaching it would
# diverge across the §13.4 matrix with every test green.
#
# `default-features` is left on for now. Trimming it is a measurement worth
# doing once the scene exists and it is clear which subsystems are unused;
# guessing at it before then would be pruning against a program that is not
# written yet.
bevy = "0.19"

# The bridge that keeps Step 2. `panel.rs` is pure `egui` and `egui_kittest`
# drives it with no window and no GPU — neither of them ever needed `eframe`,
# which is why the periodic table survives an engine change untouched.
#
# **`egui` comes through this crate rather than as a direct dependency**, which
# is deliberate: pinning `egui = "0.35"` alongside would be correct today —
# measured, `bevy_egui` 0.41.1 resolves exactly 0.35.0 — and would silently
# become two incompatible `egui`s the first time `bevy_egui` bumps. Taking it
# from the bridge means that bump is a compile error rather than a type
# mismatch nobody can read.
bevy_egui = "0.41"

# Dev-dependencies cannot affect simulation output, so the doctrine's bar is the
# low one. `egui_kittest` drives the real `draw` function through the
# accessibility tree with no window and no GPU, which is the only way to test
# the one defect a state-level test structurally cannot see: an immediate-mode
# panel painting the count one frame behind the seed that produced it.
#
# **It survived the move to Bevy**, which was not obvious in advance: it drives
# an `egui` context directly and never touched `eframe`, so every Step 2 frame
# test still describes the shipped window.
[dev-dependencies]
egui_kittest = "0.35"
