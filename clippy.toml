  { path = "f32::acos", reason = "spec §13.1 — use borbax_units::det_math::acos (convert to f64), which clamps inside" },
  { path = "f32::atan", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::atan2", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::sinh", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::cosh", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::tanh", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::asinh", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::acosh", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::atanh", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::cbrt", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  { path = "f32::hypot", reason = "spec §13.1 — not correctly rounded; add a det_math wrapper" },
  # --- f32: exactly specified, but not by the criterion above ---
  { path = "f32::powi", reason = "spec §13.1 — write the multiplication out AND pin the association in a comment; different trees give different values above exponent 2" },
  { path = "f32::mul_add", reason = "spec §13.1 — one rounding instead of two, so it changes results everywhere" },
  { path = "f32::min", reason = "spec §13.1 — non-deterministic for ±0.0; write `if a < b { a } else { b }`, which propagates NaN and returns the second argument on a tie" },
